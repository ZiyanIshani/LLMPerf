[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmperf"
version = "0.1.0"
description = "CLI load generator for benchmarking LLM inference endpoints."
requires-python = ">=3.10"
dependencies = [
    "click==8.4.2",
    "openai==2.45.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli", "load_generator", "request_result", "stats"]
